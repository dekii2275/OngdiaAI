<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bản đồ sơ tán — Cơn Mưa Lớn</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="typography.css">
  <link rel="stylesheet" href="evacuation-map.css">
  <style>body{display:flex;justify-content:center;align-items:center;padding:18px;min-height:100svh}.panel.route-panel{height:min(920px,calc(100svh - 36px))}@media(max-width:700px){body{padding:8px}.panel.route-panel{height:calc(100svh - 16px)}}</style>
  <script defer src="js/evacuation-map.js"></script>
</head>
<body>
  <main id="panel" class="panel route-panel" aria-label="Bản đồ sơ tán hoàn chỉnh"></main>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const panel=document.getElementById('panel'), map=SceneEvacuationMap;
      const state={started:false,progress:0,highlight:-1};
      panel.innerHTML=map.markup();
      const render=()=>map.update(panel,state);
      map.attach(panel,{
        onStart:()=>{state.started=true;state.progress=0;state.highlight=-1;render();},
        onSegment:index=>{
          if(!state.started){document.getElementById('route-status').textContent='Hãy chọn “Bắt đầu từ lớp 4B” trước.';return;}
          if(state.progress<4 && index!==state.progress){document.getElementById('route-status').textContent='Theo đường nối liền từ điểm vừa đọc. Quan sát chặng tiếp theo.';return;}
          state.progress=Math.min(4,state.progress+1);state.highlight=index;render();
        },
        onDone:()=>{location.href='index.html';}
      });
      render(); document.getElementById('route-done').textContent='Vào trò chơi →';
    });
  </script>
</body>
</html>
